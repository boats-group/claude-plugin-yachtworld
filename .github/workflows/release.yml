name: Release plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin name and version
        id: meta
        run: |
          echo "name=$(jq -r .name .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - name: Choose a unique tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            tag="v${VERSION}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Zip plugin
        id: zip
        env:
          NAME: ${{ steps.meta.outputs.name }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          file="${NAME}-${TAG}.zip"
          zip -r "$file" . -x '.git/*' '.github/*' '*.zip' '.DS_Store'
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          FILE: ${{ steps.zip.outputs.file }}
        run: |
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
